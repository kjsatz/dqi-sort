name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No data files
        run: python scripts/check_no_data.py
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
